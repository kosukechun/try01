AWSTemplateFormatVersion: '2010-09-09'
Description: A two-page Python website with API Gateway and Lambda.

Parameters:
  CodeBucketName:
    Type: String
    Description: Name of the S3 bucket containing your ZIP (same Region as this stack).
    MinLength: 3
    MaxLength: 63
    AllowedPattern: '^[a-z0-9][a-z0-9.-]+[a-z0-9]$'
    ConstraintDescription: Enter the bucket name only, without s3:// or a file path.
  CodeObjectKey:
    Type: String
    Description: S3 object key of the ZIP. Use a new name for each code update.
    Default: function.zip
    MinLength: 1
    MaxLength: 1024
    AllowedPattern: '^.+\.zip$'
    ConstraintDescription: Enter the ZIP object key, such as function.zip or function-v2.zip.

Resources:
  # Pythonの実行ログ。スタック削除時には、このログも削除されます。
  WebsiteLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  # Lambdaに「このログへ書き込む」権限だけを渡します。
  WebsiteRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteWebsiteLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt WebsiteLogs.Arn

  WebsiteFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Handler: main.lambda_handler
      Role: !GetAtt WebsiteRole.Arn
      MemorySize: 128
      Timeout: 5
      LoggingConfig:
        LogGroup: !Ref WebsiteLogs
      # コンソールでS3にアップロードしたZIPの場所を、パラメーターで指定します。
      Code:
        S3Bucket: !Ref CodeBucketName
        S3Key: !Ref CodeObjectKey

  WebsiteApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-http-api'
      ProtocolType: HTTP

  WebsiteIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebsiteApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt WebsiteFunction.Arn
      PayloadFormatVersion: '2.0'

  # すべてのパスをPythonに渡し、main.py側でページを選びます。
  WebsiteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebsiteApi
      RouteKey: $default
      Target: !Sub 'integrations/${WebsiteIntegration}'

  WebsiteStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn: WebsiteRoute
    Properties:
      ApiId: !Ref WebsiteApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  # このAPIからだけ、Lambdaを呼び出せるようにします。
  WebsiteInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebsiteFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebsiteApi}/*'

Outputs:
  WebsiteUrl:
    Description: Open this URL in your browser.
    Value: !GetAtt WebsiteApi.ApiEndpoint
  LogGroupName:
    Description: CloudWatch log group for troubleshooting.
    Value: !Ref WebsiteLogs
